[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-factory"
version = "0.1.0"
description = "AI-powered storytelling engine with Human-in-the-Loop workflow"
authors = [
    {name = "Narrative Factory Team", email = "team@narrativefactory.ai"}
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core workflow orchestration
    "prefect>=2.14.0",
    # Vector database and embedding
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",
    # Data validation and models
    "pydantic>=2.4.0",
    # Environment and configuration
    "python-dotenv>=1.0.0",
    # CLI framework
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    # AI/LLM clients
    "openai>=1.3.0",
    "google-genai>=0.4.0",
    # State management
    "upstash-redis>=0.15.0",
    # HTTP client for API calls
    "httpx>=0.25.0",
    # Retry logic
    "tenacity>=8.2.0",
    # Async support
    "asyncio",
    "pytest-asyncio>=1.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    
    # Code quality
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    
    # Development tools
    "ipython",
    "jupyter",
]

[project.scripts]
factory = "src.cli.commands:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.ruff]
target-version = "py39"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ruff>=0.12.3",
]
