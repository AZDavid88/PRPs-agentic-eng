[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-factory"
version = "0.1.0"
description = "AI-powered storytelling engine with Human-in-the-Loop workflow"
authors = [
    {name = "Narrative Factory Team", email = "team@narrativefactory.ai"}
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core workflow orchestration
    "prefect>=2.14.0",
    "sentence-transformers>=2.2.0",
    # Data validation and models
    "pydantic>=2.4.0",
    # Environment and configuration
    "python-dotenv>=1.0.0",
    # CLI framework
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    # AI/LLM clients
    "openai>=1.3.0",
    "google-genai>=0.4.0",
    # State management
    "upstash-redis>=0.15.0",
    # HTTP client for API calls
    "httpx>=0.25.0",
    # Retry logic
    "tenacity>=8.2.0",
    # Async support
    "asyncio",
    "pytest-asyncio>=1.0.0",
    "pydantic-settings>=2.10.1",
    "qdrant-client>=1.14.3",
    "numpy>=2.0.2",
    # Web framework (Phase 3: Web Interface)
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6", # For file uploads
    "jinja2>=3.1.0", # For template rendering
    "controlflow==0.12.1",
    "langchain-google-genai>=2.1.8",
    "pyjwt>=2.10.1",
    # T04 Production Optimization Dependencies
    "redis>=5.0.0",  # Redis async client for caching
    "prometheus_client>=0.19.0",  # Prometheus metrics collection
    "prometheus_fastapi_instrumentator>=6.1.0",  # FastAPI metrics integration
    "psutil>=5.9.0",  # System metrics (CPU, memory)
    "gunicorn>=21.2.0",  # Production WSGI server
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    
    # Code quality
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    
    # Development tools
    "ipython",
    "jupyter",
]

[project.scripts]
factory = "src.cli.commands:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Enable these rule categories for new code
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (import organization)
    "B",  # flake8-bugbear (likely bugs)
    "C4", # flake8-comprehensions
    "UP", # pyupgrade (modernize code)
]

# Ignore these for existing code compatibility
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in argument defaults (common in CLI)
    "C901",  # too complex (existing code)
    "E402",  # module level import not at top (legacy code patterns)
    "B904",  # exception chaining (existing code - fix in new code)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports ok in __init__.py
"tests/*" = ["E402", "B904"]  # relaxed rules for tests
"scripts/*" = ["E402", "B904"]  # relaxed rules for scripts

[tool.ruff.lint.isort]
# Import organization rules
known-first-party = ["src"]
force-single-line = false
lines-after-imports = 2

[tool.mypy]
mypy_path = "."
explicit_package_bases = true
python_version = "3.9"
exclude = ["scripts/", "PRPs/", "tests/"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
implicit_reexport = false
strict_equality = true

# Third-party libraries without type stubs (verified minimal list)
[[tool.mypy.overrides]]
module = [
    "qdrant_client.*",
    "upstash_redis.*", 
    "google.*",
    "psutil.*",
    "prometheus_client.*",
    "prometheus_fastapi_instrumentator.*",
]
ignore_missing_imports = true

# Module resolution conflict has been fixed by setting mypy_path = "."

# Relaxed rules for new development (can be tightened over time)
[[tool.mypy.overrides]]
module = ["src.agents.*", "src.workflows.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
# TODO: Add type annotations to agent and workflow modules

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ruff>=0.12.3",
    "types-psutil>=7.0.0.20250601",
]